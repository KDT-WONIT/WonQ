name: wonit-backend

x-backend: &backend
  image: "${BACKEND_IMAGE:?Set BACKEND_IMAGE}"
  restart: unless-stopped
  environment:
    DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL}"
    JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
    BACKEND_API_TOKEN: "${BACKEND_API_TOKEN:?Set BACKEND_API_TOKEN}"
    DEV_MODE: "false"
    QUEUE_MODE: sqs
    AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
    CHATBOT_QUEUE_URL: "${CHATBOT_QUEUE_URL:?Set CHATBOT_QUEUE_URL}"
    REPORT_QUEUE_URL: "${REPORT_QUEUE_URL:?Set REPORT_QUEUE_URL}"
    INSPECTION_QUEUE_URL: "${INSPECTION_QUEUE_URL:?Set INSPECTION_QUEUE_URL}"
    MONITORING_QUEUE_URL: "${MONITORING_QUEUE_URL:?Set MONITORING_QUEUE_URL}"

services:
  web:
    image: "${WEB_IMAGE:?Set WEB_IMAGE}"
    restart: unless-stopped
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      - backend

  backend:
    <<: *backend
    ports:
      - "${WORKER_API_BIND_IP:-127.0.0.1}:${WORKER_API_PORT:-8081}:8000"

  dispatcher:
    <<: *backend
    command: ["python", "-m", "app.dispatcher"]
